# 社群技能測試自己的 pytest 設定：放在這裡，pytest 就以這個資料夾為根目錄，
# 不會套用 repo 根目錄 pyproject.toml 的 testpaths（那是上游 tests/ 用的）。
# 不留 .pytest_cache，免得在 community/ 底下多出沒進 git 的資料夾。
[pytest]
addopts = -p no:cacheprovider -ra
python_files = test_*.py
# trading/ 是上游原樣的測試，要先照上游的資料夾樣子重組才能跑（test_trading_skills.py 會做），
# 直接收集會找錯腳本路徑。其餘是 pytest 預設就不進去的資料夾。
norecursedirs = trading .* *.egg _darcs build CVS dist node_modules venv {arch}
