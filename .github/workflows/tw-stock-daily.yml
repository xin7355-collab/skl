---
# 交易日台灣時間 15:30 抓台股快照；資料庫存在 Release 附件 tw-stock-data（不進 git 歷史）。
# 抓完觸發網頁重新部署，台股看板就會更新。
name: TW stock daily

'on':
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tw-stock-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: tw-stock-data
    steps:
      - uses: actions/checkout@v5

      - name: Download previous database
        run: |
          mkdir -p data
          # 第一次跑還沒有 Release 是「還沒設定」，不是錯誤：建立後從頭開始。
          if ! gh release download "$TAG" -p tw_stock.db -D data 2>/dev/null; then
            echo "::notice::還沒有資料庫，這次從頭開始。"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --title "tw-stock data" --latest=false \
                --notes "台股看板用的資料庫（自動產生）。資料來源：證交所、櫃買中心 OpenAPI，政府資料開放授權條款第 1 版。"
          fi

      - name: Fetch snapshots
        run: python3 xin-toolkit/skills/tw-stock/scripts/tw_stock_fetch.py fetch --db data/tw_stock.db

      # 全部失敗時資料庫仍保有舊資料與失敗紀錄，照樣上傳；網頁會顯示資料日期，看得出沒更新。
      - name: Upload database
        if: always()
        run: |
          if [ -f data/tw_stock.db ]; then
            gh release upload "$TAG" data/tw_stock.db --clobber
          else
            echo "::warning::沒有產生資料庫，略過上傳。"
          fi

      - name: Redeploy web page
        if: always()
        run: gh workflow run pages.yml --ref main
