---
name: Deploy web page

'on':
  push:
    branches: [main]
  workflow_dispatch:
  # 每天台灣時間 06:00 重新部署一次，讓 Repo X-Ray 的熱門推薦（trending.json）保持新鮮。
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 連續推送時只保留最後一次部署；進行中的部署不中斷，避免網站停在半套狀態。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 釘 24.04：「我的 App」自動健檢要用 Playwright 開瀏覽器，ubuntu-latest 換成 26.04 後鎖定的 Playwright 1.56.1 裝不了
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      trending: ${{ steps.trending.outcome }}
      fleet: ${{ steps.fleet.outcome }}
    steps:
      # 「還沒開 Pages」是還沒設定，不是壞掉：只留提示、跳過部署，不讓工作流變紅燈。
      - name: Check GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 尚未開啟，略過部署。到 https://github.com/${GITHUB_REPOSITORY}/settings/pages 把 Source 設為 GitHub Actions。"
          fi

      # 這個工作流有 pages／id-token 寫入權限，但只上傳 Pages 成品、不 git push：
      # 不把 token 留在 .git/config，後面的建置步驟（含第三方 action）就讀不到。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test builders
        run: |
          python3 web/build_catalog.py selftest
          python3 web/build_zips.py selftest
          python3 web/ai/check_ai_data.py selftest
          python3 web/build_trending.py selftest
          python3 web/build_prompts.py selftest
          python3 web/check_advisor_rules.py selftest
          python3 web/check_advisor_rules.py
          python3 web/check_guides.py selftest
          python3 web/check_guides.py
          python3 ops/discover_apps.py selftest

      - name: Build site
        env:
          # 自動找「我的 App」用（只讀公開 repo 清單）；SKL_READ_TOKEN 選用，有它才確認得到私人 repo
          GITHUB_TOKEN: ${{ github.token }}
          SKL_READ_TOKEN: ${{ secrets.SKL_READ_TOKEN }}
        run: |
          mkdir -p _site
          python3 web/build_catalog.py
          # 每個技能一個 ZIP（給 claude.ai 網頁版上傳），並在 catalog.json 寫入下載路徑，所以要在複製 catalog.json 之前跑
          python3 web/build_zips.py --out _site/zips --catalog web/catalog.json
          cp web/index.html web/ai.html web/xray.html web/dev-guide.html web/agent.html web/prompts.html web/ideas.html _site/
          cp web/search.html _site/
          cp web/ideas.json web/catalog.json web/advisor_rules.json _site/
          # 「我的 App」清單：自動找帳號底下的 repo（新 repo 隔天就出現），GitHub 查不到就退回手寫的 .github/apps.json；
          # 自動找到的私人 repo 只算數量、不寫名字（網站是公開的）
          python3 ops/discover_apps.py --config .github/apps.json --out _site/apps.json
          mkdir -p _site/ai && cp web/ai/models.json web/ai/features.json _site/ai/
          # 兩份教學頁（dev-guide、agent）共用的分頁／進度／精靈程式；網址帶 ?v=版本號，手機才不會拿到舊的快取
          mkdir -p _site/guide && cp web/guide/guide.css web/guide/guide.js _site/guide/
          # 提示詞庫的資料（索引＋32 片全文）由 Prompts sync 工作流每月更新、commit 在 repo 裡
          mkdir -p _site/prompts && cp web/prompts/*.json _site/prompts/
          # 手動重新部署時 commit 不變，版本號加上執行編號，手機才會重載到新版。
          ver="${GITHUB_SHA::7}.${GITHUB_RUN_NUMBER}"
          # APP_VER 換成版本號，前端切回前景時比對 version.json，不同就自動重載。
          sed -i "s/__APP_VER__/${ver}/" _site/index.html _site/ai.html _site/xray.html _site/dev-guide.html \
            _site/agent.html _site/prompts.html _site/ideas.html _site/search.html
          printf '{"ver":"%s"}\n' "$ver" > _site/version.json
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          grep -q 'noindex' _site/index.html
          grep -q 'noindex' _site/ai.html
          grep -q 'noindex' _site/xray.html
          grep -q 'noindex' _site/dev-guide.html
          grep -q 'noindex' _site/agent.html
          grep -q 'noindex' _site/prompts.html
          grep -q 'noindex' _site/ideas.html
          grep -q 'noindex' _site/search.html

      # 收集失敗不擋住整個網站部署（其他頁面照常更新）；但會在最後的 trending-check 亮紅燈。
      # 上一份從線上網站拿：用來算「竄升最快」，查詢失敗時也能沿用。
      - name: Collect trending repos
        id: trending
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 web/build_trending.py --out _site/trending.json \
            --prev "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/trending.json"

      # 🤖「我的 App」每天自動健檢：用無頭瀏覽器跑 xray.html 自己那一份 analyzeLite（不另寫一份），
      # 寫成 fleet.json（⛔ 只有數量，不放問題內容：網站是公開的）。失敗不擋網站部署，最後 fleet-check 亮紅燈。
      - name: Set up Node（自動健檢用）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Daily app health（fleet.json）
        id: fleet
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKL_READ_TOKEN: ${{ secrets.SKL_READ_TOKEN }}
          PW_MODULE: ${{ github.workspace }}/web/e2e/node_modules/playwright/index.mjs
        run: |
          (cd web/e2e && npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium)
          node web/build_fleet.mjs selftest
          node web/build_fleet.mjs --site _site --out _site/fleet.json \
            --prev "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/fleet.json"

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  fleet-check:
    needs: [build, deploy]
    if: always() && needs.build.outputs.fleet == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report app health failure
        run: |
          echo "::error::「我的 App」自動健檢（fleet.json）這次沒做成，網站已部署但 X-Ray 會顯示上一次的結果。看 build 工作的「Daily app health」步驟；明天 06:00 會自動重試。"
          exit 1

  trending-check:
    needs: [build, deploy]
    if: always() && needs.build.outputs.trending == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report trending collection failure
        run: |
          echo "::error::熱門推薦（trending.json）全部清單查詢失敗，網站已部署但熱門推薦沿用舊資料或改用即時查詢。看 build 工作的「Collect trending repos」步驟；GitHub 暫時故障的話，明天 06:00 會自動重試。"
          exit 1
