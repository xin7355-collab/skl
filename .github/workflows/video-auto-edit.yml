---
# 每 30 分鐘檢查以 video 開頭的「草稿 Release」，把還沒剪的影片自動剪好傳回同一個 Release。
# 草稿只有 repo 擁有者看得到，公開 repo 也不會讓影片外流。
name: Video auto edit

'on':
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-auto-edit
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCRIPTS: xin-toolkit/skills/auto-video-edit/scripts
    steps:
      - uses: actions/checkout@v5

      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Edit pending videos
        run: |
          # 裝在其他 App 時，技能在 .claude/skills 底下。
          [ -d "$SCRIPTS" ] || SCRIPTS=.claude/skills/auto-video-edit/scripts
          python3 "$SCRIPTS/video_release_runner.py" run --max 1
