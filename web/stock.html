<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台股看板">
<title>台股看板</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #5d6670; --line: #e3e6ea;
  --accent: #0f766e; --accent-soft: #e6f4f2; --accent-text: #ffffff; --warn: #b45309;
  --up: #d1242f; --down: #1a7f37; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1215; --card: #181c20; --text: #e8eaed; --muted: #9aa3ad; --line: #2a3036;
    --accent: #2dd4bf; --accent-soft: #123330; --accent-text: #06201d; --warn: #f59e0b;
    --up: #ff7b72; --down: #3fb950; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  max-width: 760px; margin: 0 auto; -webkit-text-size-adjust: 100%;
}
header { padding: 18px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 22px; margin: 0; }
header a { color: var(--accent); font-size: 14px; text-decoration: none; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin: 8px 0 12px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.controls .full { grid-column: 1 / -1; }
select, input[type="search"] {
  width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}
label.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
label.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.count { color: var(--muted); font-size: 13px; margin: 8px 2px 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.row { border-top: 1px solid var(--line); padding: 10px 0; }
.row:first-child { border-top: 0; }
.row summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
.row summary::-webkit-details-marker { display: none; }
.rank { color: var(--muted); font-size: 13px; text-align: right; }
.nm b { font-size: 16px; }
.nm small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.nm .tags { color: var(--muted); font-size: 12px; }
.metric { text-align: right; }
.metric b { font-size: 17px; font-variant-numeric: tabular-nums; }
.metric small { display: block; color: var(--muted); font-size: 11px; }
.up { color: var(--up); } .down { color: var(--down); }
.detail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 10px 0 0 36px; font-size: 13px; }
.detail div span { display: block; color: var(--muted); font-size: 11px; }
.detail div b { font-variant-numeric: tabular-nums; font-weight: 600; }
.btn {
  appearance: none; border: 0; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px;
  background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer;
}
.btn.ghost { background: var(--accent-soft); color: var(--text); font-weight: 500; }
.acts { margin: 10px 0 0 36px; display: flex; gap: 8px; flex-wrap: wrap; }
.more { width: 100%; margin-top: 8px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.6; }
.note a { color: var(--accent); }
.error, .empty { color: var(--warn); font-size: 14px; }
details.help summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
}
.toast.show { opacity: .95; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>台股看板</h1>
  <a href="./">← 技能庫</a>
</header>
<p class="sub" id="dates">載入中…</p>

<section class="card">
  <div class="controls">
    <select id="sort" class="full" aria-label="排行">
      <option value="rev_yoy">月營收年增率（高→低）</option>
      <option value="cum_yoy">累計營收年增率（高→低）</option>
      <option value="rev_mom">月營收月增率（高→低）</option>
      <option value="yield">殖利率（高→低）</option>
      <option value="pe">本益比（低→高）</option>
      <option value="pb">股價淨值比（低→高）</option>
      <option value="ret20">近 20 日漲跌（高→低）</option>
      <option value="ret5">近 5 日漲跌（高→低）</option>
      <option value="rev">月營收金額（大→小）</option>
    </select>
    <select id="market" aria-label="市場">
      <option value="">上市＋上櫃</option>
      <option value="上市">上市</option>
      <option value="上櫃">上櫃</option>
    </select>
    <select id="industry" aria-label="產業"><option value="">全部產業</option></select>
    <input id="q" class="full" type="search" placeholder="搜尋代號或名稱，例如 2330、台積電" autocomplete="off">
    <label class="toggle full"><input id="big" type="checkbox" checked> 排除月營收小於 1 億（避免基期太小的暴衝）</label>
    <label class="toggle full"><input id="noEtf" type="checkbox" checked> 排除 ETF</label>
  </div>
  <div class="count"><span id="count"></span><button class="btn ghost" id="copyList">複製這份清單</button></div>
</section>

<section class="card">
  <div id="list"></div>
  <button class="btn ghost more" id="more" hidden>顯示更多</button>
</section>

<section class="card">
  <details class="help">
    <summary>欄位說明與注意事項</summary>
    <p class="note">
      月營收金額單位為新台幣千元；年增率＝和去年同月比、月增率＝和上個月比；累計年增率由今年累計營收÷去年同期累計計算。
      近 5／20 日漲跌是用每天收集的收盤價計算，剛開始收集時資料不足會顯示「—」。
      本益比為負或無法計算時不列入本益比排行。月營收目前只有上市公司（上櫃月營收官方 OpenAPI 未收錄在本工具）。
    </p>
  </details>
  <p class="note">
    資料來源：<a href="https://openapi.twse.com.tw/" rel="noopener">臺灣證券交易所 OpenAPI</a>、
    <a href="https://www.tpex.org.tw/openapi/" rel="noopener">證券櫃檯買賣中心 OpenAPI</a>，
    依<a href="https://data.gov.tw/license" rel="noopener">政府資料開放授權條款第 1 版</a>使用。
    本頁為資料整理，<b>非投資建議</b>；數字以公開資訊觀測站公告為準。
  </p>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const APP_VER = "__APP_VER__";
const PAGE = 50; // 一次畫 50 列：兩千多檔全部畫出來，舊 iPhone 會卡
const ASC = new Set(["pe", "pb"]); // 越低越前面的排行
const LABEL = {
  rev_yoy: ["月營收年增", "%"], cum_yoy: ["累計年增", "%"], rev_mom: ["月營收月增", "%"],
  yield: ["殖利率", "%"], pe: ["本益比", ""], pb: ["淨值比", ""], ret20: ["20 日", "%"], ret5: ["5 日", "%"],
  rev: ["月營收(億)", ""],
};
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 無痕模式 */ } },
};
let data = null, rows = [], shown = PAGE, current = [];

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    if (!ok) { toast("無法自動複製，請改用長按選取"); return; }
  }
  toast("已複製 ✓");
}
function fmt(v, digits = 2) { return v === null || v === undefined ? "—" : Number(v).toLocaleString("zh-TW", { maximumFractionDigits: digits }); }
function metricVal(r, key) { return key === "rev" ? (r.rev === null ? null : r.rev / 1e5) : r[key]; }
function cls(v) { return v === null || v === undefined ? "" : v > 0 ? "up" : v < 0 ? "down" : ""; }

async function fetchJsonRetry(url, tries = 4) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-cache" });
      if (r.ok) return await r.json();
      last = new Error("HTTP " + r.status);
      if (r.status < 500 && r.status !== 429) break;
    } catch (e) { last = e; }
    if (i < tries - 1) await new Promise((res) => setTimeout(res, 1000 * 2 ** i));
  }
  throw last;
}

function filtered() {
  const key = $("sort").value, mk = $("market").value, ind = $("industry").value;
  const q = $("q").value.trim().toLowerCase(), big = $("big").checked, noEtf = $("noEtf").checked;
  let list = rows.filter((r) => {
    if (mk && r.market !== mk) return false;
    if (ind && r.industry !== ind) return false;
    if (q) return (r.code + " " + r.name).toLowerCase().includes(q);
    if (noEtf && r.etf) return false;
    if (big && ["rev_yoy", "cum_yoy", "rev_mom"].includes(key) && !(r.rev >= 100000)) return false;
    const v = r[key];
    if (v === null || v === undefined) return false;
    if (key === "pe" && v <= 0) return false;
    return true;
  });
  const dir = ASC.has(key) ? 1 : -1;
  if (!q) list.sort((a, b) => dir * (a[key] - b[key]));
  return list;
}

function analysisPrompt(r) {
  return `用 tw-stock 技能分析 ${r.code} ${r.name}（${r.market}${r.industry ? "・" + r.industry : ""}）：` +
    `月營收趨勢、估值（本益比／殖利率／淨值比）與 2～4 家同業比較，每個數字附資料出處與日期，結尾註明非投資建議。`;
}

function render() {
  const key = $("sort").value;
  current = filtered();
  $("count").textContent = `共 ${current.length} 檔`;
  const box = $("list");
  box.innerHTML = "";
  if (!current.length) { box.innerHTML = '<p class="empty">沒有符合條件的股票。</p>'; $("more").hidden = true; return; }
  const frag = document.createDocumentFragment();
  current.slice(0, shown).forEach((r, i) => {
    const el = document.createElement("details");
    el.className = "row";
    const mv = metricVal(r, key);
    const [lab, unit] = LABEL[key];
    el.innerHTML =
      `<summary><span class="rank">${i + 1}</span>` +
      `<div class="nm"><b></b><small></small><div class="tags"></div></div>` +
      `<div class="metric"><b></b><small></small></div></summary>` +
      `<div class="detail"></div><div class="acts"><button class="btn">複製分析指令</button></div>`;
    el.querySelector(".nm b").textContent = r.name || r.code;
    el.querySelector(".nm small").textContent = r.code;
    el.querySelector(".tags").textContent = [r.market, r.industry, r.etf ? "ETF" : ""].filter(Boolean).join("・");
    const mb = el.querySelector(".metric b");
    mb.textContent = fmt(mv) + unit;
    if (["rev_yoy", "cum_yoy", "rev_mom", "ret5", "ret20"].includes(key)) mb.className = cls(mv);
    el.querySelector(".metric small").textContent = lab;
    const det = [
      ["收盤", fmt(r.close), ""], ["漲跌", fmt(r.change), cls(r.change)], ["本益比", fmt(r.pe), ""],
      ["殖利率", r.yield === null ? "—" : fmt(r.yield) + "%", ""], ["淨值比", fmt(r.pb), ""],
      ["月營收(億)", r.rev === null ? "—" : fmt(r.rev / 1e5), ""],
      ["月營收年增", r.rev_yoy === null ? "—" : fmt(r.rev_yoy) + "%", cls(r.rev_yoy)],
      ["月營收月增", r.rev_mom === null ? "—" : fmt(r.rev_mom) + "%", cls(r.rev_mom)],
      ["累計年增", r.cum_yoy === null ? "—" : fmt(r.cum_yoy) + "%", cls(r.cum_yoy)],
      ["近 5 日", r.ret5 === null ? "—" : fmt(r.ret5) + "%", cls(r.ret5)],
      ["近 20 日", r.ret20 === null ? "—" : fmt(r.ret20) + "%", cls(r.ret20)],
    ];
    const d = el.querySelector(".detail");
    for (const [k, v, c] of det) {
      const cell = document.createElement("div");
      cell.innerHTML = "<span></span><b></b>";
      cell.querySelector("span").textContent = k;
      const b = cell.querySelector("b"); b.textContent = v; if (c) b.className = c;
      d.appendChild(cell);
    }
    el.querySelector(".acts button").addEventListener("click", (e) => { e.preventDefault(); copyText(analysisPrompt(r)); });
    frag.appendChild(el);
  });
  box.appendChild(frag);
  $("more").hidden = current.length <= shown;
}

function copyList() {
  const key = $("sort").value, [lab, unit] = LABEL[key];
  const head = `台股看板：${$("sort").selectedOptions[0].textContent}（資料日期 ${data.dates.twse_quotes || "—"}，月營收 ${data.dates.twse_revenue || "—"}）`;
  const lines = current.slice(0, Math.max(shown, 20)).map((r, i) =>
    `${i + 1}. ${r.code} ${r.name}｜${lab} ${fmt(metricVal(r, key))}${unit}｜收盤 ${fmt(r.close)}｜本益比 ${fmt(r.pe)}｜殖利率 ${fmt(r.yield)}%`);
  copyText([head, ...lines, "資料來源：證交所／櫃買中心 OpenAPI；非投資建議。"].join("\n"));
}

function saveUi() {
  store.set("stock-ui", { sort: $("sort").value, market: $("market").value, industry: $("industry").value,
    big: $("big").checked, noEtf: $("noEtf").checked });
}

async function load() {
  try {
    data = await fetchJsonRetry("stock.json");
  } catch (e) {
    $("dates").innerHTML = "";
    const p = document.createElement("p"); p.className = "error";
    p.textContent = "資料載入失敗（" + e.message + "）。請確認網路後重新整理；持續失敗的話，到 GitHub Actions 看「TW stock daily」或「Deploy web page」是否紅燈。";
    $("list").appendChild(p);
    return;
  }
  if (data.status !== "ok") {
    $("dates").textContent = "";
    $("list").innerHTML = '<p class="empty">還沒開始收集資料：每個交易日 15:30 後會自動更新，第一次收集完成後這裡就會出現。</p>';
    return;
  }
  rows = data.rows.map((a) => Object.fromEntries(data.fields.map((f, i) => [f, a[i]])));
  const d = data.dates;
  $("dates").textContent = `行情 ${d.twse_quotes || "—"}・月營收 ${d.twse_revenue || "—"}・共 ${rows.length} 檔` +
    (APP_VER.startsWith("__") ? "" : `・版本 ${APP_VER}`);
  const inds = [...new Set(rows.map((r) => r.industry).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  for (const x of inds) { const o = document.createElement("option"); o.value = x; o.textContent = x; $("industry").appendChild(o); }
  const ui = store.get("stock-ui", null);
  if (ui) {
    for (const k of ["sort", "market", "industry"]) {
      if ([...$(k).options].some((o) => o.value === ui[k])) $(k).value = ui[k];
    }
    $("big").checked = ui.big !== false; $("noEtf").checked = ui.noEtf !== false;
  }
  for (const id of ["sort", "market", "industry", "big", "noEtf"]) {
    $(id).addEventListener("change", () => { shown = PAGE; saveUi(); render(); });
  }
  let t;
  $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { shown = PAGE; render(); }, 150); });
  $("more").addEventListener("click", () => { shown += PAGE; render(); });
  $("copyList").addEventListener("click", copyList);
  render();
}

async function checkVersion() {
  if (APP_VER.startsWith("__")) return;
  try {
    const r = await fetch("version.json", { cache: "no-store" });
    if (!r.ok) return;
    const v = await r.json();
    if (v.ver && v.ver !== APP_VER) location.reload();
  } catch { /* 離線略過 */ }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
load();
</script>
</body>
</html>
